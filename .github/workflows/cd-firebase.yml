name: Deploy Security Rules & Indexes to Firebase

on:
  push:
    branches: [ main ]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.github/workflows/cd-firebase.yml'
  workflow_dispatch: # Permite execução manual

jobs:
  deploy-firebase-config:
    name: Deploy Rules & Indexes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Instala o Firebase CLI globalmente
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Autentica no Google Cloud usando Chave de Conta de Serviço (Service Account Key)
      # que possui permissões de edição no Firebase/Firestore.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Faz o deploy apenas das regras de segurança e índices
      - name: Deploy to Firebase
        run: |
          firebase deploy --only firestore:rules,firestore:indexes,storage --project ${{ secrets.GCP_PROJECT_ID }}
