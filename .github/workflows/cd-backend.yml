name: Deploy Backend to Google Cloud Run

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/cd-backend.yml'
  workflow_dispatch: # Permite execução manual

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }} # ID do seu projeto no GCP
  REGION: us-central1 # Região de deploy do Cloud Run
  SERVICE_NAME: spoint-backend # Nome do serviço no Cloud Run
  ARTIFACT_REGISTRY_REPO: spoint-repo # Nome do repositório no Artifact Registry

jobs:
  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Autenticação no Google Cloud usando Chave de Conta de Serviço (Service Account Key)
      # Recomendação de segurança: usar Workload Identity Federation em produção.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Autentica o Docker para o Artifact Registry do GCP
      - name: Authorize Docker
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Build e Push da imagem Docker para o Artifact Registry
      - name: Build and Push Container
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          
          # Build a partir da pasta /backend
          docker build -t $IMAGE_TAG ./backend
          
          # Envia a imagem para o GCP
          docker push $IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # Deploy no Google Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          # Passa as variáveis de ambiente necessárias para o container
          env_vars: |
            PORT=3000
            NODE_ENV=production
          # Adiciona secrets se aplicável (ex: chave do Firebase Admin ou credenciais sensíveis)
          secure_env_vars: |
            FIREBASE_SERVICE_ACCOUNT=${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Opcional: Mostrar URL pública gerada
      - name: Show URL
        run: |
          echo "O backend foi implantado com sucesso!"
